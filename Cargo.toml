[package]
name = "holler-client"
version = "0.1.0"
edition = "2021"
description = "Thin client for the Holler talk circuit"
license = "AGPL-3.0-or-later"

[lib]
name = "holler_client"
path = "src/lib.rs"

[[bin]]
name = "stub-acp"
path = "tests/stub-acp/src/main.rs"

[[bin]]
name = "holler"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "2.1.0"
# HTTP interrupt fallback (issue #27) targets a plain-HTTP local agent
# control endpoint, never HTTPS, so no TLS backend is enabled here.
reqwest = { version = "0.12", default-features = false }
# CLI parsing for the `holler` binary (issue #23), same justification as
# the server's #29 CLI: hand-rolled arg parsing doesn't scale past a
# couple of flags, and this is the de facto standard crate for it.
clap = { version = "4", features = ["derive"] }
# OS hostname for `join`/`hello` (issue #23): std has no portable way to
# read this, and this crate is a small, widely used single-purpose shim.
gethostname = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
toml = "0.8"
# Issue #24: the live WebSocket session (`holler run`). Same crate and
# version as holler-server's own choice (its Cargo.toml), so both sides of
# the circuit exercise the same WebSocket implementation.
#
# Issue #65: `rustls-tls-native-roots` is required for `--server wss://...`
# to work at all — with no TLS feature enabled, connect_async() fails every
# wss:// dial with "TLS support not compiled in". rustls-tls (pure Rust) is
# preferred over native-tls per ADR-0010 (no OpenSSL/system-dependency
# friction on GitHub-hosted macOS/Windows runners).
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
# Issue #65: rustls 0.23 does not auto-select a crypto provider even with
# rustls-tls-native-roots enabled above — without an explicit provider
# feature, the first TLS handshake panics at runtime ("Could not
# automatically determine the process-level CryptoProvider"). `ring` is
# the lighter-weight, pure-Rust-friendly choice of the two providers
# rustls supports.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3.34", features = ["sink"] }
# RFC 3339 envelope timestamps (`ts`), same crate as holler-server's own
# `hello.rs` uses for the same purpose — avoids hand-rolling date math for
# a field the wire codec never parses back anyway.
time = { version = "0.3", features = ["formatting", "parsing"] }
# Advisory `flock` for the single-instance guard on `holler run` (issue
# #52). Already present as a transitive dependency of several crates in
# this tree (see Cargo.lock) — declaring it directly just makes explicit
# use of what's already compiled in, rather than pulling in a new crate
# (e.g. `fs2`) for the same syscall.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
rstest = "0.23"
