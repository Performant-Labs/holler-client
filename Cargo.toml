[package]
name = "holler-client"
version = "0.1.0"
edition = "2021"
description = "Thin client for the Holler talk circuit"
license = "Proprietary"

[lib]
name = "holler_client"
path = "src/lib.rs"

[[bin]]
name = "stub-acp"
path = "tests/stub-acp/src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
