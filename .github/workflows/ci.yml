name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      # Windows is deliberately OFF the matrix (not soft-failed) as of
      # 2026-09-06 -- `src/instance_lock.rs` (issue #52) unconditionally
      # imports `std::os::unix::io::AsRawFd`, which does not exist on
      # Windows, so this crate currently fails to *compile* there. This
      # is real, tracked work (holler-client#60), not something to leave
      # as permanent CI noise until it's addressed. Add `windows-latest`
      # back to this list once that's fixed.
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable
        shell: pwsh

      - name: Full test suite
        run: cargo test
        shell: pwsh

      # Real cross-process interop tests (holler-server#94's harness):
      # these are deliberately #[ignore]d in their own files (need a built
      # sibling holler-server binary + `--ignored`) and were not run
      # anywhere automatically before this -- see holler-server#313, which
      # fixed the same gap in scripts/test-run.rb's local runner.
      - name: Checkout holler-server (sibling, for real interop tests)
        uses: actions/checkout@v4
        with:
          repository: Performant-Labs/holler-server
          path: ../holler-server

      - name: Build sibling holler-server binary
        run: cargo build --release
        shell: pwsh
        working-directory: ../holler-server

      - name: Interop test -- mint/join/run/roster/status/stop
        env:
          HOLLER_SERVER_BIN: ${{ github.workspace }}/../holler-server/target/release/holler-server
        run: cargo test --test interop_smoke_test -- --ignored
        shell: pwsh

      - name: Interop test -- SIGINT/SIGTERM on a live run against a real server
        env:
          HOLLER_SERVER_BIN: ${{ github.workspace }}/../holler-server/target/release/holler-server
        run: cargo test --test io_behavior -- --ignored
        shell: pwsh

      - name: Interop test -- server restart is recovered by the client's reconnect loop
        env:
          HOLLER_SERVER_BIN: ${{ github.workspace }}/../holler-server/target/release/holler-server
        run: cargo test --test network -- --ignored
        shell: pwsh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        shell: pwsh
