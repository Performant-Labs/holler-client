name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Linux and macOS are required. Windows is allowed to be red for now —
    # `src/instance_lock.rs` (issue #52) unconditionally imports
    # `std::os::unix::io::AsRawFd`, which does not exist on Windows, so
    # this crate currently fails to *compile* there (not a flaky test,
    # unlike holler-server's Windows exception). Tracked as its own issue;
    # remove this once that's fixed.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable
        shell: pwsh

      - name: Full test suite
        run: cargo test
        shell: pwsh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        shell: pwsh
